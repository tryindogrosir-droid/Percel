<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aplikasi Parcel bonus Soal v1.2.2</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16221d;--mut:#62706a;--ac:#0f6b4f;--acl:#dcefe8;--bad:#b3261e;--ln:#d5ddd9;--onac:#fff;--onbad:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#101714;--card:#18221d;--ink:#e8f0ec;--mut:#9aaba3;--ac:#4cc79d;--acl:#1f3a30;--bad:#ff8a80;--ln:#2c3a33;--onac:#06271c;--onbad:#3a0a06}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 80px}
main{max-width:560px;margin:auto;padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;border:0;background:none;color:var(--mut);padding:14px 12px;font:inherit;font-size:13px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
h2{font-size:18px;margin:16px 0 8px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.g{display:flex;flex-wrap:wrap;gap:8px}
.b{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;min-height:46px}
.b.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.b.pri{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:700;width:100%}
.b.bad{color:var(--bad);border-color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
details>summary{font-weight:700;font-size:17px;margin:14px 0 6px;cursor:pointer}.m{color:var(--mut);font-size:14px}.warn{background:var(--bad);color:var(--onbad);padding:10px;border-radius:10px;margin-bottom:10px;font-weight:600}
.ok{background:var(--acl);padding:10px;border-radius:10px;margin-bottom:10px}
input.up{text-transform:uppercase}input{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov>div{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
.nota{background:#fff;color:#111;border:1px solid #999;padding:14px;font-size:15px}
.nota .row{border-bottom:1px dotted #bbb}.stamp{text-align:center;font-weight:800;font-size:20px;color:#b3261e;border:2px solid #b3261e;padding:4px;margin:6px 0}
#bonus{--surface:var(--card);--text:var(--ink);--muted:var(--mut);--border:var(--ln);--accent:var(--ac);--code-bg:var(--bg);--code-text:var(--ink);line-height:1.6}
#bonus h2{font-size:20px;font-weight:500;margin:0 0 6px}#bonus h2.kategori{font-size:17px;margin:28px 0 10px;padding-bottom:6px;border-bottom:.5px solid var(--border)}
#bonus .intro{color:var(--muted);font-size:15px;margin:0 0 16px}#bonus .jumlah{font-size:13px;color:var(--muted);margin:8px 0}
#bonus .bn-row{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
#bonus .atas{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center}#bonus .demo{display:flex;flex-direction:column;gap:8px;min-width:0}
#bonus .nama{font-weight:500;color:var(--accent);margin:0;font-family:ui-monospace,Menlo,Consolas,monospace}#bonus .nama::after{content:" :";color:var(--muted)}
#bonus .penjelasan{margin:0;font-size:15px}#bonus .label{font-size:13px;color:var(--muted);margin:10px 0 4px}
#bonus pre{background:var(--code-bg);color:var(--code-text);border-radius:8px;padding:10px 12px;margin:0;font-size:13px;overflow-x:auto;white-space:pre-wrap}
#bonus .kotak{border:1px dashed var(--border);border-radius:8px;padding:10px;font-size:14px;color:var(--muted)}
#bonus input,#bonus select,#bonus textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;width:100%;max-width:100%;margin:0}
#bonus input[type=checkbox],#bonus input[type=radio]{width:18px;height:18px;padding:0;accent-color:var(--accent)}
#bonus label.opsi{display:flex;align-items:center;gap:8px;font-size:15px}
#bonus button{font:inherit;font-size:15px;background:var(--accent);color:var(--onac);border:none;border-radius:8px;padding:8px 16px;cursor:pointer;align-self:flex-start}
#bonus button.kedua{background:transparent;color:var(--accent);border:1px solid var(--border)}
#bonus a{color:var(--accent)}#bonus nav{position:static;display:block;background:none;border:0;overflow:visible}#bonus main{max-width:none;margin:0;padding:0}
#bonus details{border:1px solid var(--border);border-radius:8px;padding:8px 12px}#bonus summary{cursor:pointer;font-size:15px;font-weight:400;margin:0}
#bonus dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;max-width:300px}
#bonus table{border-collapse:collapse;width:100%;font-size:14px}#bonus th,#bonus td{border:1px solid var(--border);padding:5px 8px;text-align:left}
#bonus .top-tabs{background:var(--surface);border:.5px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px}
#bonus .tab-bar{display:flex;border-bottom:.5px solid var(--border)}
#bonus .tab-btn{flex:1;background:none;color:var(--muted);border:none;border-bottom:3px solid transparent;padding:14px 8px}
#bonus .tab-btn.aktif{color:#3DBE8B;font-weight:500;border-bottom-color:#3DBE8B}
#bonus .tab-panel{padding:16px 18px;display:none;font-size:15px}#bonus .tab-panel.aktif{display:block}
#bonus .tab-panel h3{margin:0 0 6px;font-size:16px;font-weight:500}#bonus .tab-panel p{margin:0 0 8px;color:var(--muted)}
#bonus input[type=submit],#bonus input[type=reset],#bonus input[type=button]{width:auto;background:var(--accent);color:var(--onac);border:none;padding:8px 16px;cursor:pointer}#bonus input[type=reset]{background:transparent;color:var(--accent);border:1px solid var(--border)}
#soal h2{font-size:20px;font-weight:500;margin:0 0 12px}
#soal .q{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px}
#soal .qn{font-weight:700;color:var(--ac);margin-bottom:4px}#soal .qt{margin:0 0 10px}
#soal textarea{width:100%;min-height:110px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--bg);border:2px solid var(--ln);border-radius:8px;padding:10px;margin:0 0 10px;resize:vertical}
#soal textarea.benar{border-color:var(--ac)}#soal textarea.salah{border-color:var(--bad)}
#soal button{font:inherit;background:var(--ac);color:var(--onac);border:0;border-radius:8px;padding:10px 18px}
#soal .hasil{display:none;margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:700;align-items:center;gap:10px}
#soal .hasil i{font-style:normal;font-size:22px;line-height:1}
#soal .hasil.benar{display:flex;color:var(--ac);background:var(--acl);border:1px solid var(--ac)}
#soal .hasil.salah{display:flex;color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad)}
#soal .hasil.info{display:flex;color:var(--mut);border:1px dashed var(--ln)}
#soal .btns,#soal .nv{display:flex;gap:8px;flex-wrap:wrap}#soal .nv{justify-content:space-between}#soal .nv input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;margin:0}
#soal button.kedua{background:transparent;color:var(--ac);border:1px solid var(--ln)}#soal button:disabled{opacity:.4}
#soal .kb{margin-top:12px}#soal .kb pre.kunci{margin:4px 0 0}#soal pre.kunci{margin:12px 0 0;padding:10px 12px;background:var(--bg);color:var(--ink);border-radius:8px;font-size:13px;overflow-x:auto;white-space:pre-wrap}
#hasil h2{font-size:20px;font-weight:500;margin:0 0 6px}#hasil iframe{display:block;width:100%;height:60vh;min-height:320px;border:1px solid var(--ln);border-radius:10px;background:#fff}
#hasil #hs-tab{background:var(--card);border:1px solid var(--ln);border-radius:10px 10px 0 0;padding:8px 12px;font-size:14px;margin-bottom:-1px}
@media(max-width:620px){#bonus .atas{grid-template-columns:1fr}}
@media print{nav,.noprint,main>*:not(.ov){display:none!important}.ov{position:static;background:none}.ov>div{max-height:none;padding:0}}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const kosong=()=>({supplier:[],belanja:[],toko:{nama:"",hp:""},barang:[],parcel:[],pembeli:[],orders:[],notas:[],seq:1,dirty:0,last:null});
let db=kosong(),revLokal=0;
try{let s=localStorage.getItem("kasirParcel");if(s){try{db=Object.assign(kosong(),JSON.parse(s))}catch(e){try{localStorage.setItem("kasirParcel_rusak",s)}catch(x){}setTimeout(()=>alert("Data tersimpan rusak. Salinannya disimpan terpisah dan aplikasi mulai dari kosong. Pulihkan dari file cadangan kalau ada."),300)}}}catch(e){}
revLokal=db.rev||0;
sanit(db);
function okImg(t){return typeof t=="string"&&/^data:image\/(png|jpe?g|webp);base64,[A-Za-z0-9+\/=]+$/.test(t)}
function sanit(d){if(d&&d.toko&&d.toko.logo&&!okImg(d.toko.logo))delete d.toko.logo;((d&&d.parcel)||[]).forEach(p=>{if(p&&p.foto&&!okImg(p.foto))delete p.foto});return d}
const dev=()=>{try{return localStorage.getItem("kasirParcel_perangkat")||"utama"}catch(e){return"utama"}};
const roHP=()=>dev()=="cadangan";
function lg(k){db.log=db.log||[];db.log.push({t:iso(0)+" "+new Date().toTimeString().slice(0,5),o:role||"-",k});if(db.log.length>1000)db.log=db.log.slice(-1000)}
const validBayar=t=>validTgl(t)&&t<=iso(0);
const bl=x=>!isNaN(x)&&x>=0&&x==Math.floor(x);
const nID=x=>{let t=String(x==null?"":x).replace(/rp/ig,"").replace(/\s/g,"");if(t==="")return NaN;if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,"").replace(",",".");else if(/^\d+,\d+$/.test(t))t=t.replace(",",".");else if(/^\d{1,3}(,\d{3})+$/.test(t))t=t.replace(/,/g,"");if(!/^\d+(\.\d+)?$/.test(t))return NaN;return parseFloat(t)};
const plab=p=>p.jenis=="dp"?"DP":p.jenis=="refund"?"Refund":"Lunas";
const kodeGen=()=>{let A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",u=new Uint8Array(12);try{crypto.getRandomValues(u)}catch(e){u=u.map(()=>Math.floor(Math.random()*256))}return [...u].map(x=>A[x%32]).join("").replace(/(.{4})(?=.)/g,"$1-")};
const nk=x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,"");
const askPw=(j,l)=>new Promise(res=>{openForm(j,[{l,t:"text",pw:true}],v=>{res(v[0])})});
const b64=u=>{let t="";for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function kunciPw(pw,salt,use){let km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,[use])}
async function enkrip(t,pw){let salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await kunciPw(pw,salt,"encrypt"),ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(t)));return JSON.stringify({enc:1,salt:b64(salt),iv:b64(iv),data:b64(ct)})}
async function dekrip(d,pw){let k=await kunciPw(pw,ub64(d.salt),"decrypt"),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(d.iv)},k,ub64(d.data));return new TextDecoder().decode(pt)}
const save=()=>{
 try{let cur=JSON.parse(localStorage.getItem("kasirParcel")||"{}");if((cur.rev||0)>revLokal){alert("Data sudah berubah di jendela lain. Muat ulang halaman supaya tidak saling menimpa.");return}}catch(e){}
 try{revLokal++;db.rev=revLokal;localStorage.setItem("kasirParcel",JSON.stringify(db))}catch(e){alert("Penyimpanan browser gagal. Segera ekspor cadangan.")}};
const rp=n=>"Rp"+Math.round(n||0).toLocaleString("id-ID");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const iso=(d=0)=>{let t=new Date();t.setDate(t.getDate()-d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const validTgl=t=>{let m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(t);if(!m)return false;let d=new Date(+m[1],m[2]-1,+m[3]);return d.getFullYear()==+m[1]&&d.getMonth()==m[2]-1&&d.getDate()==+m[3]};
const tgl=s=>{let[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const H=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const modal=b=>b.modal!=null?b.modal:(b.beli||0)/(b.isi||1);
const modalParcel=p=>p.isi.reduce((s,i)=>{let b=db.barang.find(x=>x.id==i.b);return s+(b?modal(b)*i.q:0)},0)+(p.kemasan||0);
const minDP=t=>Math.min(t,Math.ceil(t*gp("dp",50)/100));
const paid=o=>o.pays.reduce((s,p)=>s+p.amt,0);
let tab="trx",tx=null;
const tabs={trx:"Jual",ord:"Pembeli",nota:"Nota",rkp:"Rekap",mst:"Master",bak:"Cadangan",bns:"Bonus",soal:"Soal",hasil:"Hasil"};
function go(t){tab=t;draw()}
let role=null,gagal=lkLoad().g||0,kunci=lkLoad().k||0,lastAct=Date.now(),pinBuf="",pinCb=null,pinMeta=[];
function lkLoad(){try{return JSON.parse(localStorage.getItem("kasirParcel_kunci")||"{}")}catch(e){return{}}}
function lkSave(){try{localStorage.setItem("kasirParcel_kunci",JSON.stringify({g:gagal,k:kunci}))}catch(e){}}
const hsh=p=>{let h1=0xdeadbeef,h2=0x41c6ce57,t="pcl|"+p;for(let i=0,c;i<t.length;i++){c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)};
const izin=()=>roHP()?(role=="admin"?["nota","rkp","bak"]:["nota"]):(role=="admin"?Object.keys(tabs):["trx","ord","nota","mst"]);
function draw(){
 db.supplier=db.supplier||[];db.belanja=db.belanja||[];
 if(!db.auth||!db.auth.admin)return setupAwal();
 if(!role)return layarLogin();
 let ok=izin();if(!ok.includes(tab))tab=ok[0];
 let wv="";if(db.versi!==VERSI){if(vcmp(db.versi||"0",VERSI)>0)wv=`<div class="warn">Data ini terakhir ditulis oleh versi v${H(db.versi)} yang LEBIH BARU dari file ini (v${VERSI}). Jangan mencatat di sini; pakai file versi terbaru.</div>`;else if(!roHP()){let lama=db.versi||"-";db.versi=VERSI;lg("Aplikasi diperbarui: v"+lama+" -> v"+VERSI);save()}}
 nav.innerHTML=ok.map(k=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${tabs[k]}</button>`).join("");
 {let a=nav.querySelector(".on");if(a)a.scrollIntoView({inline:"nearest",block:"nearest"})}
 if(tab=="bns"){app.innerHTML=vBns();bonusInit();return}
 if(tab=="soal"){app.innerHTML=vSoal();soalInit();return}
 if(tab=="hasil"){app.innerHTML=vHasil();hasilInit();return}
 let ld=db.last?-hari(db.last.slice(0,10)):null,sb=ld==null?"belum pernah dicadangkan":ld<=0?"terakhir dicadangkan hari ini":"terakhir dicadangkan "+ld+" hari lalu";
 let w=roHP()?`<div class="ok"><b>HP CADANGAN (baca saja).</b> Transaksi hanya dicatat di HP utama.</div>`:db.dirty?`<div class="warn">${db.dirty} perubahan belum dicadangkan (${sb}). ${role=="admin"?"Buka tab Cadangan.":"Beri tahu admin untuk mencadangkan."}</div>`:(db.orders.length&&ld!==0)?`<div class="ok">Cadangan ${sb}. Sebaiknya cadangkan saat toko tutup.</div>`:"";
 let h=`<div class="row m"><span>Masuk sebagai <b>${role=="admin"?"Admin":"User"}</b></span><span class="g"><button class="b" style="min-height:34px;padding:4px 12px" onclick="bantuan()">Bantuan</button><button class="b" style="min-height:34px;padding:4px 12px" onclick="kunciSekarang()">Kunci</button></span></div><div class="m" style="margin-bottom:6px"><b>v${VERSI}</b> &middot; ${roHP()?"HP CADANGAN":"HP UTAMA"} &middot; ${H(namaHP())} &middot; giliran #${gil().no||0}${gil().pj?(roHP()?" &middot; diserahkan ke: ":" &middot; penanggung jawab: ")+H(gil().pj):""}</div>`;
 app.innerHTML=h+wv+w+({trx:vTrx,ord:vOrd,nota:vNota,rkp:vRkp,mst:vMst,bak:vBak}[tab])();if(rfh)rfh();
}
/* ---------- login ---------- */
function pinUI(judul,sub,cb,extra){pinBuf="";pinCb=cb;pinMeta=[judul,sub,extra||""];pinDraw()}
function pinDraw(){let[j,sb,ex]=pinMeta;nav.innerHTML="";
 app.innerHTML=`<div style="text-align:center;padding-top:24px"><h2>${j}</h2><div class="m">${sb}</div><div style="font-size:32px;letter-spacing:10px;margin:14px 0;min-height:44px">${"&#9679;".repeat(pinBuf.length)||"&nbsp;"}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="b" style="font-size:22px" onclick="pinKey(${n})">${n}</button>`).join("")}<button class="b" onclick="pinDel()">Hapus</button><button class="b" style="font-size:22px" onclick="pinKey(0)">0</button><button class="b pri" onclick="pinOk()">OK</button></div>${ex}</div>`}
function pinKey(n){if(pinBuf.length<6){pinBuf+=n;pinDraw()}}
function pinDel(){pinBuf=pinBuf.slice(0,-1);pinDraw()}
function pinOk(){if(pinBuf.length<4)return alert("PIN minimal 4 angka");let p=pinBuf;pinBuf="";pinCb(p)}
function setupAwal(){let first;
 const ex=`<br><div class="m">Sudah punya file cadangan?</div><input type="file" accept=".json" onchange="pulih(this)">`;
 pinUI("Buat PIN admin","4 sampai 6 angka. Catat PIN ini, tidak bisa dipulihkan.",p=>{first=p;pinUI("Ulangi PIN admin","",q=>{if(q!=first){alert("PIN tidak sama. Ulangi.");setupAwal();return}let kd=kodeGen();db.auth={admin:hsh(q),user:null,rec:hsh(nk(kd))};db.dirty++;save();role="admin";lastAct=Date.now();tab="trx";draw();alert("KODE PEMULIHAN PIN ADMIN:\n\n"+kd+"\n\nCatat di kertas dan simpan di tempat aman. Kalau PIN admin lupa, kode ini satu-satunya cara memulihkannya. Kode hanya tampil sekali.")})},ex);
}
function layarLogin(){nav.innerHTML="";app.innerHTML=`<div style="text-align:center;padding-top:40px"><h2>${H(db.toko.nama)||"Parcel Indogrosir"}</h2><div class="m">Parcel Indogrosir v${VERSI}</div><div class="m">Masuk sebagai</div><br><button class="b pri" onclick="pilihRole('admin')">Admin</button><br><br><button class="b" style="width:100%" onclick="pilihRole('user')">User</button><br><br><button class="b" onclick="lupaPin()">Lupa PIN admin?</button></div>`}
function pilihRole(r){
 if(r=="user"&&!db.auth.user)return alert("PIN user belum dibuat. Masuk sebagai admin untuk membuatnya.");
 if(Date.now()<kunci)return alert("Terlalu banyak salah. Tunggu "+Math.ceil((kunci-Date.now())/1000)+" detik.");
 pinUI("PIN "+(r=="admin"?"Admin":"User"),"",p=>{
  if(hsh(p)==db.auth[r]){gagal=0;lkSave();role=r;lastAct=Date.now();tab="trx";tx=null;draw()}
  else{gagal++;if(gagal>=5){gagal=0;kunci=Date.now()+30000;alert("PIN salah 5 kali. Coba lagi 30 detik lagi.")}else alert("PIN salah.");lkSave();layarLogin()}
 },`<br><button class="b" onclick="layarLogin()">Kembali</button>`);
}
function buatKode(){if(!confirm("Buat kode pemulihan baru? Kode lama tidak berlaku lagi."))return;let k=kodeGen();db.auth.rec=hsh(nk(k));lg("Buat kode pemulihan PIN");chg();alert("KODE PEMULIHAN PIN ADMIN:\n\n"+k+"\n\nCatat di kertas dan simpan di tempat aman. Kode hanya tampil sekali.")}
function lupaPin(){if(!db.auth.rec)return alert("Kode pemulihan belum pernah dibuat di HP ini. Pulihkan data dari file cadangan di HP lain atau hubungi pembuat aplikasi.");
 if(Date.now()<kunci)return alert("Terlalu banyak salah. Tunggu "+Math.ceil((kunci-Date.now())/1000)+" detik.");

  gagal=0;lkSave();setTimeout(()=>{let first;pinUI("PIN admin baru","4 sampai 6 angka",p=>{first=p;pinUI("Ulangi PIN admin baru","",q=>{

mua tab", "Riwayat versi di tab Cadangan; nomor versi tampil di judul, header, dan nama file cadangan", "Peringatan kalau data berasal dari versi yang lebih baru; pembaruan versi tercatat di Log aktivitas", "Daftar uji coba dua HP di dalam Bantuan"]}, {"v": "1.1", "d": "2026-10-17", "j": "Perbaikan bug, keamanan, dan pengaman human error", "f": ["Bug: nota yang sudah terbit tidak berubah lagi saat catatan pesanan diubah", "Bug: batal nota hanya mengembalikan stok untuk parcel yang belum dibuat, dan tercatat di riwayat stok", "Bug: parcel tanpa isi atau berharga Rp0 ditolak saat disimpan dan saat dijual; nama parcel ganda ditolak", "Bug: impor CSV membaca angka format Indonesia (7.000 menjadi 7000)", "Bug: ongkir manual tidak menempel setelah keranjang atau pengiriman berubah", "Bug: nama barang ganda ditolak; modal Rp0 dan angka tidak wajar meminta konfirmasi", "Bug: logo dan foto divalidasi (cegah penyuntikan HTML dari file cadangan)", "Bug: cetak 58 dan 80 mm memakai tinggi halaman eksplisit", "Human error: kolom angka bulat menolak desimal; isi parcel bisa dikurangi satu per satu; tanggal bayar masa depan ditolak; peringatan harga di bawah modal; pelunasan ganda dicegah", "Fitur: HP cadangan baca-saja, pengingat cadangan berbasis waktu, Refund, Log aktivitas", "Fitur: cadangan berpassword (enkripsi AES) dan kode pemulihan PIN admin"]}, {"v": "1.0", "d": null, "j": "Basis: file parcel__21_.html yang Anda unggah", "f": ["Stok opname, pencatatan Rusak atau kedaluwarsa, dan Riwayat stok", "Stok dipesan versus stok di rak; pelacakan Dibuat n dari m, Tandai semua sudah dibuat, dan Sudah diambil", "Kemasan per komponen, foto parcel, dan logo toko", "Ongkos kirim standar dan gratis ongkir mulai jumlah parcel tertentu", "Tanggal ambil atau kirim, jatuh tempo, daftar siapkan barang, tagih dan bagikan nota lewat WhatsApp", "Impor dan ekspor CSV untuk barang dan pembeli; ekspor CSV nota dan rekap", "Rekap lengkap: periode (hari, 7 hari, bulan, rentang), kas, jadwal pengambilan, perlu dibeli, perlu dibuat, margin", "Pengaturan: DP minimal, margin target, jatuh tempo, awalan nomor nota, ukuran cetak (a4, 58, 80)"]}, {"v": "0.6", "d": null, "j": "Versi awal: Supplier dan modal rata-rata", "f": ["Supplier, harga beli per pcs dan per karton, modal rata-rata tertimbang saat Tambah stok, riwayat belanja", "Ubah dan Hapus untuk barang, parcel, pembeli, supplier (tidak boleh dihapus kalau sudah dipakai)"]}, {"v": "0.5", "d": null, "j": "Versi awal: Keamanan dan kemudahan input", "f": ["Login PIN admin dan user, kunci otomatis, pembatasan menu dan harga deal untuk user", "Nama pembeli otomatis huruf besar dengan peringatan nama ganda; tambah pembeli langsung di layar Jual; ketuk pilih dan ketuk lagi untuk batal"]}, {"v": "0.4", "d": null, "j": "Versi awal: Stok dan rekap", "f": ["Stok per barang, penjualan ditolak kalau stok kurang, peringatan per parcel dengan batas per barang", "Rekap penjualan dan keuntungan, daftar belum lunas, data contoh, DP minimal 50 persen"]}, {"v": "0.3", "d": null, "j": "Versi awal: Nota", "f": ["Nomor nota berurutan, reprint, pembatalan dengan alasan, nota pengganti", "Nota DP tetap utuh; nota pelunasan memuat DP dan pelunasan beserta tanggalnya"]}, {"v": "0.2", "d": null, "j": "Versi awal: Pembayaran dan cadangan", "f": ["Pembayaran DP dan Lunas dengan tanggal, tombol kirim cadangan, peringatan belum dicadangkan"]}, {"v": "0.1", "d": null, "j": "Versi awal: Dasar", "f": ["Master barang, parcel, pembeli; transaksi lewat ketukan; format Rupiah bertitik; modal dan keuntungan per parcel"]}];
const BANTUAN=[{"t": "Mulai cepat", "h": "<ol><li>Buka file di Chrome. Buat <b>PIN admin</b> (4 sampai 6 angka) dan <b>catat kode pemulihan</b> yang muncul satu kali.</li><li>Tab <b>Master</b>: isi Toko, Supplier, Barang (dengan harga beli), lalu Parcel (isi, harga jual, kemasan).</li><li>Tab <b>Jual</b>: pilih pembeli, parcel, cara bayar, tanggal, lalu Simpan. Nota terbit otomatis.</li><li>Pelunasan: tab <b>Pembeli</b>, ketuk <b>Lunasi sisa</b>.</li><li>Setiap akhir hari: tab <b>Cadangan</b>, ketuk <b>Kirim cadangan</b>.</li></ol><p>Untuk latihan, pakai tombol <b>Muat data master contoh</b> di tab Cadangan. Sebelum dipakai sungguhan, ketuk <b>Hapus semua data</b> supaya nomor nota mulai dari awal.</p>"}, {"t": "Tab Jual (mencatat penjualan)", "h": "<ol><li><b>Pembeli</b>: ketuk nama untuk memilih, ketuk lagi untuk membatalkan. <b>+ Pembeli baru</b> menambah nama langsung (otomatis huruf besar; nama yang sama atau mirip diperingatkan).</li><li><b>Parcel</b>: ketuk untuk memilih, ketuk lagi untuk batal. Tombol <b>-</b> dan <b>+</b> mengubah jumlah. Tulisan \"stok N paket\" adalah berapa paket yang masih bisa dibuat. <b>Harga deal</b> hanya untuk admin.</li><li><b>Bayar</b>: Tunai atau Transfer, lalu DP atau Lunas. DP minimal mengikuti Pengaturan (bawaan 50 persen dari total). Pakai tombol nominal atau <b>Nominal lain</b>. DP yang sama dengan total otomatis tercatat Lunas.</li><li><b>Tanggal bayar</b>: Hari ini, Kemarin, 2 hari lalu, atau Tanggal lain. Tanggal di masa depan ditolak.</li><li><b>Pengambilan dan catatan</b> (opsional): tanggal ambil atau kirim dan catatan.</li><li><b>Pengiriman</b>: Ambil sendiri atau Dikirim. Ongkir otomatis dari Pengaturan dan bisa diubah lewat <b>Ubah ongkir</b>.</li></ol><p>Lalu ketuk <b>Simpan dan terbitkan nota</b>. Penjualan ditolak kalau stok tidak cukup, parcel tanpa isi atau berharga Rp0, atau DP di bawah minimal.</p>"}, {"t": "Tab Pembeli (pesanan)", "h": "<ul><li>Atur tampilan: <b>Per transaksi</b> atau <b>Per pembeli</b>; saring Belum lunas, Lunas, Belum diambil, Belum selesai dibuat, Sedang dibuat, Siap diambil; urutkan Terbaru, Sisa terbesar, atau Ambil terdekat.</li><li><b>Dibuat n/m</b> dengan tombol - dan +: catat berapa parcel yang sudah dikemas. <b>Tandai semua sudah dibuat</b> untuk sekaligus.</li><li><b>Lunasi sisa</b>: pilih metode dan tanggal, lalu terbit nota pelunasan. <b>Tagih WhatsApp</b> membuat pesan penagihan.</li><li><b>Daftar siapkan barang</b>: rincian barang yang harus diambil dari rak, bisa dikirim lewat WhatsApp.</li><li><b>Sudah diambil</b>: menandai pesanan selesai dan barangnya dianggap terpakai (ada konfirmasi).</li><li><b>Ubah catatan</b>: mengubah tanggal ambil dan catatan pesanan. Nota yang sudah terbit tidak ikut berubah.</li><li><b>Refund</b> (admin): isi nominal (maksimal sebesar yang sudah dibayar), pilih metode dan alasan. Total pesanan turun dan nota baru terbit. Stok tidak berubah; kalau barang kembali ke rak, catat lewat Opname.</li><li>Keuntungan per pesanan hanya terlihat oleh admin.</li></ul>"}, {"t": "Tab Nota", "h": "<ul><li>Daftar semua nota; saring Semua, Belum lunas, Lunas, Batal. <b>Ekspor CSV</b> untuk disimpan.</li><li><b>Buka</b> nota: <b>Cetak / simpan PDF</b>, <b>Bagikan WhatsApp</b>, atau <b>Reprint</b> (cetak ulang bertanda REPRINT, isi tidak berubah).</li><li><b>Batalkan</b> (admin): pilih alasan. Hanya nota terbaru dari satu pesanan yang bisa dibatalkan. Stok hanya kembali untuk parcel yang belum dibuat. Nota pengganti berikutnya otomatis mencantumkan \"Pengganti INV-xxxx\".</li><li>Nota tidak pernah diedit. Kalau salah, batalkan lalu buat transaksi baru.</li><li>Awalan nomor nota dan ukuran cetak (a4, 58, 80 mm) diatur di Master, Pengaturan.</li></ul>"}, {"t": "Tab Rekap (admin)", "h": "<ul><li>Periode: Hari ini, 7 hari, Bulan ini, Semua, Pilih bulan, atau Rentang tanggal.</li><li><b>Ringkasan</b>: jumlah transaksi, penjualan, modal, keuntungan, margin, uang diterima, sisa belum dibayar.</li><li><b>Keuangan kas</b>: uang diterima, belanja barang, selisih kas.</li><li><b>Jadwal pengambilan</b>, <b>Perlu dibeli</b> (stok di bawah batas), <b>Perlu dibuat</b> (parcel belum dikemas dan barang yang diambil dari rak).</li><li><b>Ekspor CSV</b> dan <b>Cetak ringkasan</b>.</li></ul><p>Catatan: keuntungan dihitung dari modal rata-rata, bukan dari kas. Ongkir tidak dihitung sebagai penjualan. Uang diterima dihitung menurut tanggal tiap pembayaran.</p>"}, {"t": "Tab Master (data dasar)", "h": "<ul><li><b>Toko</b>: nama, nomor HP, dan Logo. <b>Ubah pengaturan</b>: DP minimal, margin target, jatuh tempo, peringatan ambil, awalan nomor nota, ukuran cetak, ongkir standar, gratis ongkir.</li><li><b>Supplier</b>: nama toko pemasok (Ubah, Hapus).</li><li><b>Barang</b>: <b>+ Barang</b> (nama, isi per satuan besar, stok awal, batas peringatan, modal per pcs, nama satuan). Di tiap barang: <b>+ Harga beli</b> (per supplier, per pcs atau per karton; yang termurah ditandai), <b>Tambah stok</b>, <b>Opname</b>, <b>Rusak</b>, <b>Riwayat stok</b>, <b>Salin</b>, <b>Ubah</b>, <b>Hapus</b>. Ada juga <b>Opname semua</b> dan impor atau ekspor CSV.</li><li><b>Parcel</b>: <b>+ Parcel</b> (nama, isi dengan tombol + dan -, harga jual). <b>Kemasan</b> (biaya per komponen), <b>Foto</b>. Aplikasi memberi peringatan kalau harga di bawah modal dan menampilkan modal serta untung.</li><li><b>Pembeli</b>: nama, nomor HP, alamat, catatan; impor atau ekspor CSV.</li><li>Barang, parcel, pembeli, dan supplier yang sudah dipakai di transaksi tidak bisa dihapus.</li></ul>"}, {"t": "Stok dan modal", "h": "<ul><li><b>Stok</b> berkurang saat penjualan disimpan. <b>Di rak sekarang</b> = stok ditambah barang yang sudah dipesan tetapi parcelnya belum dibuat.</li><li><b>Tambah stok</b>: pilih harga beli (supplier dan jenis), isi jumlah. Modal per pcs dihitung ulang sebagai rata-rata tertimbang dari stok lama dan belanja baru.</li><li><b>Opname</b>: isi jumlah fisik di rak; selisih tercatat. <b>Rusak</b>: kurangi stok barang rusak, kedaluwarsa, atau hilang.</li><li><b>Riwayat stok</b> mencatat penjualan, belanja, opname, rusak, dan pembatalan.</li><li>Peringatan merah muncul kalau stok di bawah batas barang atau tidak cukup untuk satu paket.</li></ul>"}, {"t": "Peran admin dan user", "h": "<ul><li><b>Admin</b>: semua tab, modal, untung, refund, pembatalan, pengaturan, dan cadangan.</li><li><b>User</b>: Jual, Pembeli, Nota, dan Master baca-saja; tanpa modal, untung, harga deal, refund, dan pembatalan.</li><li>PIN user dibuat admin di tab Cadangan, bagian Keamanan. Aplikasi terkunci otomatis setelah 3 menit tidak disentuh; PIN salah 5 kali menahan percobaan 30 detik.</li></ul>"}, {"t": "HP utama, HP cadangan, dan serah terima", "h": "<ul><li>Hanya <b>satu HP utama</b> yang boleh mencatat. <b>HP cadangan</b> hanya membaca (tab Nota, Rekap, Cadangan), supaya nomor nota dan stok tidak bentrok.</li><li><b>Serah terima</b> (di HP utama): Cadangan, <b>Serahkan peran utama ke HP lain</b>. Isi penanggung jawab berikutnya dan password file (boleh kosong). HP ini langsung menjadi cadangan, lalu file dikirim lewat Bluetooth, Quick Share, atau WhatsApp.</li><li>Di HP penerima: <b>Pulihkan</b>, pilih file, lalu jawab \"Jadikan HP ini HP UTAMA?\".</li><li>Banner di atas layar selalu menunjukkan HP UTAMA atau CADANGAN, nama HP, nomor giliran, dan penanggung jawab. Beri nama HP lewat <b>Nama HP ini</b>. Penanggung jawab bisa diubah lewat <b>Ubah penanggung jawab</b>. Kalau serah terima dibatalkan dan HP ini dijadikan utama lagi, aplikasi memberi peringatan dan menanyakan penanggung jawabnya.</li><li>Aturan: satu penanggung jawab per hari; serah terima saat toko tutup; transaksi saat serah terima dicatat di buku dulu; jangan memulihkan file lama ke HP utama.</li></ul>"}, {"t": "Cadangan dan pemulihan", "h": "<ul><li><b>Kirim cadangan</b>: pilih password (kosong berarti tanpa password; sangat disarankan memakai password). Catat password, file tidak bisa dibuka tanpanya.</li><li>Cadangkan tiap akhir hari. Banner merah menunjukkan jumlah perubahan dan sudah berapa hari sejak cadangan terakhir.</li><li><b>Pulihkan</b> mengganti seluruh data di HP itu. Aplikasi menolak file yang lebih tua, menyebut nota yang akan hilang, dan membandingkan nota terakhir sebelum Anda mengonfirmasi.</li><li><b>Hapus semua data</b> (dua konfirmasi) mengosongkan transaksi, barang, dan pembeli; PIN dan log tetap.</li><li>Data tersimpan di browser HP. Menghapus data situs di browser menghilangkan data, jadi cadangan wajib.</li></ul>"}, {"t": "Keamanan dan log", "h": "<ul><li>PIN hanyalah pembatas tampilan, bukan enkripsi data. Perlindungan sungguhan hanya untuk file cadangan berpassword.</li><li><b>Kode pemulihan PIN</b> muncul satu kali saat membuat PIN; <b>Buat kode pemulihan PIN</b> membuat yang baru. Di layar masuk, <b>Lupa PIN admin?</b> memakai kode itu.</li><li><b>Log aktivitas</b> di tab Cadangan mencatat penghapusan, pembatalan, refund, impor, pemulihan, pengaturan, dan pembaruan versi.</li></ul>"}, {"t": "Cara pindah ke versi baru", "h": "<ol><li>Di file versi lama: tab Cadangan, <b>Kirim cadangan</b> (dengan password).</li><li>Buka file versi baru (nama berakhiran versi, misalnya Aplikasi Parcel bonus Soal v1.2.2.html).</li><li>Di layar awal, pilih file cadangan di bawah \"Sudah punya file cadangan?\" atau pakai tombol Pulihkan, lalu masukkan password.</li><li>Cek tab Cadangan: nomor versi dan <b>Riwayat versi</b> menunjukkan fitur baru; Log aktivitas mencatat pembaruan.</li></ol><p>Jangan membuka data dari versi yang lebih baru di file versi lama; aplikasi akan memberi peringatan.</p>"}, {"t": "Uji coba dua HP (sebelum dipakai sungguhan)", "h": "<p>Siapkan HP A dan HP B dengan file yang sama persis. Centang tiap langkah (ada 16). Kriteria lulus ada di bagian akhir.</p><ol><li><b>HP A</b>: buat PIN admin (misalnya 1234) dan catat kode pemulihan. <i>Hasil: layar utama terbuka, banner HP UTAMA, giliran #0.</i></li><li><b>HP A</b>: Cadangan, <b>Nama HP ini</b> = HP A, lalu <b>Muat data master contoh</b> dan <b>Tambah 4 transaksi contoh</b>. <i>Hasil: tab Nota berisi INV-0001 sampai INV-0005.</i></li><li><b>HP A</b>: Jual satu transaksi (Ibu Eka, PARCEL HEMAT, DP minimal). <i>Hasil: INV-0006 terbit; stok Teh, Wafer, dan Gula 1/2 kg berkurang.</i></li><li><b>HP A</b>: Cadangan, <b>Serahkan peran utama</b>, penanggung jawab \"HP B\", password uji123, kirim file ke HP B. <i>Hasil: HP A langsung tertulis HP CADANGAN; hanya tab Nota, Rekap, Cadangan.</i></li><li><b>HP B</b>: buka file; di layar awal pilih file cadangan (tanpa membuat PIN dulu), isi password uji123, jawab Ya pada \"Jadikan HP ini HP UTAMA?\", lalu masuk dengan PIN dari HP A. <i>Hasil: HP UTAMA, giliran #1, penanggung jawab HP B; INV-0001 sampai INV-0006 ada.</i></li><li><b>HP B</b>: Jual (Bapak Budi, PARCEL 3), lalu Pembeli, Ibu Citra, <b>Lunasi sisa</b>. <i>Hasil: INV-0007 dan INV-0008 berurutan tanpa lompat atau kembar; nota pelunasan memuat DP dan Lunas.</i></li><li><b>HP A</b> (cadangan): cari tombol Jual, Lunasi, Batalkan. <i>Hasil: tidak ada.</i></li><li><b>HP B</b>: Serahkan peran utama ke HP A (penanggung jawab \"HP A\", password uji123). <b>HP A</b>: Pulihkan, pilih file, terima peran utama. <i>Hasil: HP A UTAMA giliran #2; HP B CADANGAN; INV-0008 ada di HP A.</i></li><li><b>Bandingkan</b> HP A dan HP B: Rekap (Semua periode) dan stok di Master. <i>Hasil: jumlah transaksi, total penjualan, sisa belum dibayar, stok, dan nomor nota terakhir sama.</i></li><li><b>HP A</b>: Pulihkan file dari langkah 4. <i>Hasil: ditolak dengan pesan \"File ini LEBIH TUA\".</i></li><li><b>HP A</b>: Pulihkan file terkunci dengan password salah. <i>Hasil: ditolak, data tidak berubah.</i></li><li><b>HP A</b>: catat satu transaksi baru (INV-0009), lalu Pulihkan file dari langkah 8. <i>Hasil: peringatan \"HP ini punya 1 nota yang TIDAK ada di file (INV-0009)\"; pilih Batal.</i></li><li><b>HP A</b>: Nota, INV-0009, <b>Batalkan</b>, pilih alasan. <i>Hasil: stok kembali, Riwayat stok mencatat \"Batal nota\", Log aktivitas mencatat.</i></li><li><b>PIN</b>: masukkan PIN salah 5 kali, tunggu 30 detik, lalu pakai <b>Lupa PIN admin?</b> dengan kode pemulihan. <i>Hasil: PIN baru bisa dibuat.</i></li><li><b>Nota</b>: buka satu nota, <b>Cetak / simpan PDF</b> dan <b>Bagikan WhatsApp</b>. Kalau ada printer 58 atau 80 mm, ubah ukuran di Pengaturan lalu coba cetak. <i>Hasil: tampilan rapi, tidak terpotong.</i></li><li><b>Selesai</b>: di kedua HP, <b>Hapus semua data</b> supaya nomor nota mulai dari awal. Catat PIN dan kode pemulihan.</li></ol><p><b>Kriteria lulus:</b> (1) tidak pernah ada dua HP yang bisa mencatat sekaligus; (2) data kedua HP sama setelah serah terima; (3) file lama, password salah, dan nota yang akan hilang selalu diperingatkan.</p>"}, {"t": "Istilah singkat", "h": "<ul><li><b>DP</b>: uang muka. <b>Opname</b>: menghitung stok fisik. <b>Giliran</b>: nomor urut serah terima. <b>Penanggung jawab</b>: orang yang memegang HP utama.</li><li><b>Reprint</b>: cetak ulang nota dengan isi yang sama. <b>Modal rata-rata</b>: rata-rata harga beli tertimbang dari stok lama dan baru.</li></ul>"}];
BANTUAN.splice(BANTUAN.findIndex(x=>x.t=="Cara pindah ke versi baru"),0,{"t": "Cara membuka file di HP", "h": "<ul><li>Buka file dari aplikasi File atau Download lewat Chrome. Alamat di Chrome bisa berawalan content:// atau file://.</li><li>Penyimpanan data (di browser) terikat pada alamat itu. Kalau file dibuka dari lokasi atau cara yang berbeda, data bisa tampak kosong.</li><li>Selalu buka file yang sama dengan cara yang sama. Setelah menutup dan membuka lagi, pastikan data masih ada.</li><li>Kalau ada menu Tambahkan ke layar utama di Chrome, pakai itu agar tidak salah membuka.</li><li>Cadangkan tiap akhir hari, karena data hilang kalau data situs di browser dihapus.</li></ul>"});

function bonusInit(){
 const wd=document.getElementById("bn-daftar"),ci=document.getElementById("bn-cari"),jm=document.getElementById("bn-jumlah"),grup=[];
 BONUS.forEach(k=>{const h=document.createElement("h2");h.className="kategori";h.textContent=k.judul;wd.appendChild(h);const g={h,r:[]};grup.push(g);
  k.items.forEach(it=>{const r=document.createElement("div");r.className="bn-row";r.innerHTML='<div class="atas"><div class="demo"></div><div><p class="nama"></p><p class="penjelasan"></p></div></div><p class="label">Contoh penggunaan:</p><pre></pre>';
   r.querySelector(".demo").innerHTML=it.demo;r.querySelector(".nama").textContent=it.n;r.querySelector(".penjelasan").textContent=it.d;r.querySelector("pre").textContent=it.c||"(lihat elemen terkait)";wd.appendChild(r);g.r.push({r,t:(it.n+" "+it.d).toLowerCase()})})});
 const total=grup.reduce((a,g)=>a+g.r.length,0);
 const saring=()=>{const q=ci.value.trim().toLowerCase();let n=0;grup.forEach(g=>{let a=0;g.r.forEach(x=>{const ok=!q||x.t.includes(q);x.r.style.display=ok?"":"none";if(ok)a++});g.h.style.display=a?"":"none";n+=a});jm.textContent=n+" elemen ditampilkan dari "+total};
 ci.addEventListener("input",saring);saring();
 document.querySelectorAll("#bonus .tab-btn").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#bonus .tab-btn").forEach(x=>x.classList.remove("aktif"));document.querySelectorAll("#bonus .tab-panel").forEach(x=>x.classList.remove("aktif"));
  b.classList.add("aktif");document.getElementById(b.dataset.tab).classList.add("aktif")}));

</script><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPSjxHOgJy7gFsO7G8nz2M7WT6zaESYZY",
  authDomain: "penjualan-percel.firebaseapp.com",
  projectId: "penjualan-percel",
  storageBucket: "penjualan-percel.firebasestorage.app",
  messagingSenderId: "472595221202",
  appId: "1:472595221202:web:1bab153545a1600469bb0b"
};

const fbApp = initializeApp(firebaseConfig);
const fbDb = getFirestore(fbApp);
const rupiah = n => "Rp" + Math.round(n || 0).toLocaleString("id-ID");

window.kirimNotaKeFirebase = async (o, pembeliNama) => {
  const bersih = JSON.parse(JSON.stringify({ ...o, pembeliNama, dibuatPada: new Date().toISOString() }));
  await setDoc(doc(fbDb, "nota", o.id), bersih);
};

// Tombol kecil di pojok kanan atas
const tombol = document.createElement("button");
tombol.textContent = "Firebase";
tombol.style.cssText = "position:fixed;top:6px;right:6px;z-index:50;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid #888;background:#fff;color:#111;opacity:.9";
tombol.onclick = bukaPanel;
document.body.appendChild(tombol);

function bukaPanel() {
  let wrap = document.getElementById("fbpanel");
  if (wrap) wrap.remove();
  wrap = document.createElement("div");
  wrap.id = "fbpanel";
  wrap.style.cssText = "position:fixed;inset:0;background:#000a;z-index:60;display:flex;align-items:flex-end;justify-content:center";
  wrap.innerHTML = `<div style="background:#fff;color:#111;width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:16px;font:15px system-ui,sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">Firebase</b><button id="fbtutup" style="padding:6px 12px">Tutup</button></div>
    <p>Nota di HP ini: <b>${db.orders.length}</b></p>
    <button id="fbsemua" style="padding:10px;width:100%;margin:6px 0">Kirim semua nota lama ke Firebase</button>
    <button id="fbrekap" style="padding:10px;width:100%;margin:6px 0">Lihat rekap dari Firebase</button>
    <div id="fbout" style="margin-top:10px"></div></div>`;
  document.body.appendChild(wrap);
  document.getElementById("fbtutup").onclick = () => wrap.remove();
  const out = document.getElementById("fbout");

  document.getElementById("fbsemua").onclick = async () => {
    out.textContent = "Mengirim...";
    let ok = 0, gagal = 0;
    for (const o of db.orders) {
      try {
        const pb = db.pembeli.find(x => x.id == o.pembeli);
        await window.kirimNotaKeFirebase(o, pb ? pb.nama : "");
        ok++;
      } catch (e) { gagal++; console.warn(e); }
    }
    out.textContent = "Terkirim: " + ok + ". Gagal: " + gagal + ".";
  };

  document.getElementById("fbrekap").onclick = async () => {
    out.textContent = "Mengambil data...";
    try {
      const snap = await getDocs(collection(fbDb, "nota"));
      let jumlah = 0, totalNota = 0, per = {};
      snap.forEach(d => {
        const x = d.data();
        jumlah++;
        totalNota += x.total || 0;
        (x.pays || []).forEach(p => { const k = p.date || "-"; per[k] = (per[k] || 0) + (p.amt || 0); });
      });
      const baris = Object.keys(per).sort().map(k =>
        `<div style="display:flex;justify-content:space-between;border-bottom:1px dotted #bbb;padding:4px 0"><span>${k}</span><span>${rupiah(per[k])}</span></div>`).join("");
      out.innerHTML = `<p>Jumlah nota di Firebase: <b>${jumlah}</b><br>Total nilai nota: <b>${rupiah(totalNota)}</b></p><b>Pembayaran per tanggal</b>${baris || "<p>Belum ada data.</p>"}`;
    } catch (e) { out.textContent = "Gagal mengambil data: " + e.message; }
  };
}
</script>
